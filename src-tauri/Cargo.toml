[package]
name = "bible-app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The bench binary (src/bin/bench_stt.rs) must not make `cargo run` ambiguous.
default-run = "bible-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bible_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# Pick a sermon recording to learn from.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
md-5 = "0.10"
cpal = "0.15"
hound = "3.5"
# Decode a sermon recording (mp3/m4a/wav/flac) without shipping ffmpeg, so a church
# can teach the app a new preacher from a file, on any machine, offline.
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "wav", "flac"] }
strsim = "0.11"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
# Rendered PDF pages cross the IPC boundary as text. Already in the lockfile as
# a transitive dependency, so naming it here adds no download and no new code.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Job object: guarantees the whisper server dies with us even if we are killed
# outright, so a model-sized chunk of RAM can never be orphaned.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # Asking the OS to load vulkan-1.dll / nvcuda.dll is how we find out whether
    # this machine's graphics driver can actually run a GPU whisper build.
    "Win32_System_LibraryLoader",
] }

